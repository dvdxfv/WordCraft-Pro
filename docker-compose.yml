services:
  wordcraft-pro:
    build:
      context: .
      dockerfile: Dockerfile
    image: wordcraft-pro:latest
    container_name: wordcraft-pro
    restart: unless-stopped
    # 端口铁律：必须写 127.0.0.1 前缀。写成 "3001:5000" 会绑 0.0.0.0 并绕过 ufw
    ports:
      - "127.0.0.1:3001:5000"
    # 凭据不进镜像：运行时从宿主机 /opt/wordcraft-pro/.env 注入环境变量
    env_file:
      - /opt/wordcraft-pro/.env
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).status < 500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
